<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prayer Bank - Settings</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main class="phone">
    <section class="screen">
      <header class="settings-title">
        <p class="eyebrow">Prayer Bank</p>
        <h1 class="display">Settings</h1>
        <p class="muted">Manage your preferences and protect access to your prayer matters.</p>
      </header>

      <section class="settings-group" aria-labelledby="security-heading">
        <h2 class="settings-group-label" id="security-heading">Security</h2>
        <div class="settings-panel">
          <a class="settings-row" href="app-lock.html">
            <span class="settings-icon" aria-hidden="true">⌾</span>
            <span class="settings-copy">
              <h2>App lock</h2>
              <p class="muted small">Protect access with a four-digit PIN</p>
            </span>
            <span class="settings-status">Off</span>
            <span class="chevron" aria-hidden="true">›</span>
          </a>
        </div>
      </section>
    </section>

    <nav class="bottom-nav five" aria-label="Primary navigation">
      <a class="nav-item" href="today.html"><span class="nav-mark"></span>Today</a>
      <a class="nav-item" href="prayer-bank.html"><span class="nav-mark"></span>Bank</a>
      <a class="nav-item" href="answered.html"><span class="nav-mark"></span>Answered</a>
      <a class="nav-item" href="review.html"><span class="nav-mark"></span>Review</a>
      <a class="nav-item active" href="settings.html"><span class="nav-mark"></span>Settings</a>
    </nav>
  </main>
</body>
</html>
