<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prayer Bank - Add Prayer</title><link rel="stylesheet" href="theme.css"></head>
<body><main class="phone"><section class="screen no-nav">
  <header class="topbar"><button class="text-button">Cancel</button><h1>Add prayer</h1><button class="text-button">Save</button></header>
  <form><div class="field"><label for="matter">Prayer matter</label><input class="input" id="matter" value="Grace for the youth meeting"></div><div class="field"><label for="details">Details</label><textarea class="input" id="details">For clear teaching, receptive hearts, and wisdom in every conversation.</textarea></div><div class="field"><label for="category">Category</label><select class="input" id="category"><option>Church</option><option>Family</option><option>Personal</option><option>Work</option></select></div>
  <div class="field"><label>Schedule</label><div class="chip-row"><span class="chip">Daily</span><span class="chip active">Weekly</span><span class="chip">Selected days</span></div></div><div class="field"><label>Day</label><div class="chip-row"><span class="chip">Sun</span><span class="chip">Mon</span><span class="chip">Tue</span><span class="chip active">Wed</span><span class="chip">Thu</span><span class="chip">Fri</span><span class="chip">Sat</span></div></div>
  <button class="primary-button full" type="button">Save prayer</button></form>
</section></main></body></html>
